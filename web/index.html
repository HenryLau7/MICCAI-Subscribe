<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Unofficial mobile-first conference planner for MICCAI 2026 (Strasbourg, 27 Sep - 1 Oct)."
    />
    <!--
      SPEC 7.1: start the program bundle in parallel with the module graph.
      Without this the 386 KB fetch cannot begin until the JS has loaded AND
      executed, which is the bulk of the first-visit LCP on venue Wi-Fi.
      crossorigin is required for as="fetch" to match load.ts's fetch()
      (mode cors, credentials same-origin) — without it the preload is a
      no-cors request, never reused, and the bundle downloads twice.
    -->
    <link rel="preload" href="/data/program.min.json" as="fetch" crossorigin="anonymous" />
    <title>MICCAI Subscribe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
